services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronicles
      POSTGRES_PASSWORD: chronicles
      POSTGRES_DB: chronicles
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicles"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chronicles:chronicles@db:5432/chronicles
      STORAGE_DIR: /data/storage
      LIBRARY_DIR: /library
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data/storage
      - "./Летопись природы:/library:ro"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
